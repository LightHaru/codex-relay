name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-release:
    runs-on: macos-latest
    environment: release
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12"
          package-manager-cache: false

      - name: Verify tag and metadata
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}"
          npm run release:check

      - name: Run checks
        run: npm run check

      - name: Build the source update payload and manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          archive="codex-relay-source-${version}.zip"
          git archive --format=zip --prefix="codex-relay-${version}/" HEAD > "${archive}"
          sha256="$(shasum -a 256 "${archive}" | awk '{print $1}')"
          python3 - "${version}" "${archive}" "${sha256}" <<'PY'
          import json
          import sys

          version, archive, sha256 = sys.argv[1:]
          json.dump(
              {
                  "schema": 1,
                  "product": "codex-subscription-router",
                  "version": version,
                  "sourceUrl": f"https://github.com/LightHaru/codex-relay/releases/download/v{version}/{archive}",
                  "sourceSha256": sha256,
                  "releaseUrl": f"https://github.com/LightHaru/codex-relay/releases/tag/v{version}",
                  "notes": "Verified Codex Relay source update. Relay will stage it, restart, and reopen automatically.",
              },
              open("windows-update.json", "w", encoding="utf-8"),
              indent=2,
          )
          with open("windows-update.json", "a", encoding="utf-8") as handle:
              handle.write("\n")
          PY

      - name: Create source-only GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            "codex-relay-source-${version}.zip" \
            windows-update.json \
            "scripts/bootstrap_windows.ps1#install-codex-relay.ps1"
